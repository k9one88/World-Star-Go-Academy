name: Daily Site Health Check (08:00 UTC+8)

on:
  schedule:
    # 00:00 UTC = 08:00 AM Malaysia / Beijing Time (UTC+8)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/check-site.py"
      - ".github/workflows/daily-site-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/check-site.py"
      - ".github/workflows/daily-site-check.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-site-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health-check:
    name: Routine Site & Live Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright & Chromium
        run: |
          python3 -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run site health check
        id: check
        shell: bash
        run: |
          set +e
          python3 scripts/check-site.py --browser --check-live --markdown-out report.md
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Sync GitHub Issue alert (schedule / manual runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const exitCode = Number('${{ steps.check.outputs.exit_code }}');
            const report = fs.existsSync('report.md')
              ? fs.readFileSync('report.md', 'utf8')
              : 'Health check failed without generating report.md.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issueTitle = '[每日例行检查] 站点健康检查发现需要修正的项目';

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.title === issueTitle
            );

            if (exitCode !== 0) {
              const body = `${report}\n\n🔗 [查看本次检查日志](${runUrl})`;
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueTitle,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `✅ 最新一次例行检查已全部通过，自动关闭此提醒。\n\n${report}\n\n🔗 [查看本次检查日志](${runUrl})`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Fail job if checks found issues
        if: steps.check.outputs.exit_code != '0'
        run: exit 1
